name: Kurulum Derle
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyQt6 pyinstaller
      - run: python -m PyInstaller --name GameHub_PS_Salon --onedir --windowed --noconfirm --clean --icon assets/icon.ico --add-data "assets;assets" main.py
      - run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: |
          $v = (Select-String -Path core/surum.py -Pattern 'SURUM\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSurum=$v" kurulum.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GameHub_Kurulum
          path: Output/GameHub_Kurulum_*.exe
